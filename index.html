<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste SIPAT</title>
</head>

<body>

<h1>Teste de envio para a planilha</h1>

<p>Nome:</p>
<input id="nome">

<p>Matrícula:</p>
<input id="matricula">

<br><br>

<button onclick="enviar()">
Enviar
</button>

<script>

async function enviar(){

const dados = {
    nome: document.getElementById("nome").value,
    matricula: document.getElementById("matricula").value,
    pontuacao: 100,
    acertos: 1
};

await fetch(
"https://script.google.com/macros/s/AKfycbxDHxPdGd9iD95dHFr449Nhcwt70WLk4Obue2jtPCFOVr4BqYIfxGUoXpewqZ2MnhTmhw/exec",
{
method:"POST",
body: JSON.stringify(dados)
});

alert("Enviado com sucesso!");

}

</script>

</body>
</html>
